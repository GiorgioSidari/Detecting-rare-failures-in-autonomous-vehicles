[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "detecting-rare-failures"
version = "0.1.0"
description = "Detecting rare failures in autonomous vehicles"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "tensorflow>=2.13",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
include = ["embedder*", "evaluation*", "simulators*", "scenarios*", "pipeline*", "api*"]